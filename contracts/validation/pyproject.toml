[project]
name = "arboresce-contract-validation"
version = "0.1.0"
description = "Prepared validators for public contract fixtures"
requires-python = "==3.14.7"
license = "MIT OR Apache-2.0"
dependencies = [
  "check-jsonschema==0.38.0",
  "jsonschema==4.26.0",
  "rfc3986-validator==0.1.1",
]

[tool.uv]
package = false
required-version = "==0.12.10"

[dependency-groups]
dev = [
  "coverage==7.16.0",
  "hypothesis==6.167.1",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "ruff==0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-config --strict-markers -ra"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests/support.py", "tests/conftest.py", "tests/process_observation/observe_cli.py"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
