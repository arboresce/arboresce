[package]
name = "arboresce-xtask"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.0"
description = "Local architecture checks and verification commands"
license = "MIT OR Apache-2.0"
publish = false
default-run = "arboresce-xtask"

[[bin]]
name = "arboresce-xtask-test-peer"
path = "tests/support/peer.rs"
test = false

[dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["std"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.10.9", default-features = false }
syn = { version = "=2.0.119", default-features = false, features = ["full", "parsing", "visit"] }
proc-macro2 = { version = "=1.0.106", default-features = false }

[lints.rust]
unsafe_code = "forbid"
