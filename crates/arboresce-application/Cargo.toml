[package]
name = "arboresce-application"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.0"
description = "Typed application ports for the Arboresce engine"
license = "MIT OR Apache-2.0"
publish = false
readme = "README.md"

[package.metadata.arboresce]
architecture-profile = "continuity-recognition-v1"

[dependencies]
arboresce-domain = { path = "../arboresce-domain", version = "=0.0.0" }
serde = "=1.0.229"
serde_json = "=1.0.151"
sha2 = { version = "=0.10.9", default-features = false, features = ["force-soft"] }

[lints.rust]
unsafe_code = "forbid"
