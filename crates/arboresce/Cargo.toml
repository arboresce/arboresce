[package]
name = "arboresce"
version = "0.0.0"
edition = "2024"
authors = ["Tyson Lupul <tyson@arboresce.ai>"]
rust-version = "1.98.0"
description = "Rust SDK for the Arboresce engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arboresce/arboresce"
homepage = "https://arboresce.ai"
readme = "README.md"
keywords = ["arboresce"]
include = ["src/**", "tests/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "Cargo.toml"]

[lib]
name = "arboresce"
path = "src/lib.rs"
