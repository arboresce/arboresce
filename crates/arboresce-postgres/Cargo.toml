[package]
name = "arboresce-postgres"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.0"
description = "Isolated PostgreSQL migration and transaction foundation"
license = "MIT OR Apache-2.0"
publish = false
readme = "README.md"

[dependencies]
arboresce-application = { version = "=0.0.0", path = "../arboresce-application" }
arboresce-domain = { version = "=0.0.0", path = "../arboresce-domain" }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "migrate", "runtime-tokio"] }
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "time", "net", "sync"] }

[dev-dependencies]
arboresce-xtask = { version = "=0.0.0", path = "../../tools/xtask" }
serde_json = "=1.0.151"

[lints.rust]
unsafe_code = "forbid"

[[test]]
name = "authority_current"
path = "authority_current.rs"

[[test]]
name = "authority_races"
path = "authority_races.rs"

[[test]]
name = "qualification"
path = "qualification.rs"
