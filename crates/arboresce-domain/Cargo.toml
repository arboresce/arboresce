[package]
name = "arboresce-domain"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.0"
description = "Checked domain values for the Arboresce engine"
license = "MIT OR Apache-2.0"
publish = false
readme = "README.md"

[package.metadata.arboresce]
architecture-profile = "jcs-number-v1"

[dependencies]
serde_json_canonicalizer = "=0.4.1"
sha2 = { version = "=0.10.9", default-features = false, features = ["force-soft"] }

[dev-dependencies]
serde_json = "=1.0.151"

[lints.rust]
unsafe_code = "forbid"
